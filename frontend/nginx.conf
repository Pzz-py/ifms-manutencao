server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Compressão básica para os estáticos da SPA.
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;

    # API — proxy server-to-server para o container do backend.
    # Como o navegador só fala com o Nginx (mesma origem da página),
    # isso também elimina qualquer necessidade de CORS entre
    # frontend e backend nesta configuração.
location /api/ {
    proxy_pass https://ifms-manutencao-backend.up.railway.app/api/;
    proxy_http_version 1.1;
    proxy_set_header Host ifms-manutencao-backend.up.railway.app;    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}
location /uploads/ {
    proxy_pass https://ifms-manutencao-backend.up.railway.app/uploads/;
    proxy_set_header Host ifms-manutencao-backend.up.railway.app;
}

    # SPA: qualquer rota que não seja um arquivo real cai no index.html,
    # para o react-router assumir o roteamento no cliente.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
