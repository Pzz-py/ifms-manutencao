services:
  backend:
    build:
      context: ./backend
    container_name: ifms-manutencao-backend
    restart: unless-stopped
    environment:
      DATABASE_URL: "file:/app/data/dev.db"
      PORT: "3333"
      NODE_ENV: "production"
      # Mantido por compatibilidade (CORS): como o frontend em produção
      # acessa a API via proxy do Nginx (mesma origem), isso na prática
      # só importa se você chamar a API diretamente de fora do compose.
      FRONTEND_URL: "http://localhost:${FRONTEND_PORT:-5173}"
      JWT_SECRET: "${JWT_SECRET:-troque-este-valor-por-um-segredo-forte}"
      JWT_EXPIRES_IN: "${JWT_EXPIRES_IN:-7d}"
      UPLOADS_DIR: "uploads"
    volumes:
      # Banco SQLite persistente — sobrevive a `docker compose down` e a
      # rebuilds da imagem (só some com `docker compose down -v`).
      - backend-data:/app/data
      # Fotos anexadas aos chamados, pela mesma razão.
      - backend-uploads:/app/uploads
    ports:
      - "${BACKEND_PORT:-3333}:3333"
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3333/api/health', r => process.exit(r.statusCode===200?0:1)).on('error', () => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - ifms-net

  frontend:
    build:
      context: ./frontend
    container_name: ifms-manutencao-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${FRONTEND_PORT:-5173}:80"
    networks:
      - ifms-net

volumes:
  backend-data:
  backend-uploads:

networks:
  ifms-net:
    driver: bridge
